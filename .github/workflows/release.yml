name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  CURSEFORGE_PROJECT_ID: "1654224"
  WAGO_PROJECT_ID: "nKW37pKE"

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag against the TOC version
        run: |
          toc=$(sed -n 's/^## Version:[[:space:]]*//p' Markr/Markr.toc | tr -d '\r')
          if [ "$toc" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Markr.toc says $toc but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build the changelog from feat and fix commits
        run: |
          set -euo pipefail
          range=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null | sed 's/$/../' || true)

          section() {
            local body
            body=$(git log --no-merges --pretty=format:%s "$range$GITHUB_REF_NAME" \
              | sed -n "s/^$1\(([^)]*)\)\?!\?: //p" | sed 's/^./\U&/')
            [ -z "$body" ] && return 0
            printf '## %s\n\n' "$2"
            echo "$body" | sed 's/^/- /'
            printf '\n'
          }

          {
            printf '# %s\n\n' "$GITHUB_REF_NAME"
            section feat Added
            section fix Fixed
          } > CHANGELOG.md

          if [ "$(wc -l < CHANGELOG.md)" -le 2 ]; then
            printf 'No player-facing changes.\n' >> CHANGELOG.md
          fi

          cat CHANGELOG.md

      - name: Package, upload to CurseForge and Wago, create the GitHub release
        uses: BigWigsMods/packager@v2
        with:
          pandoc: false
          args: -p ${{ env.CURSEFORGE_PROJECT_ID }} -a ${{ env.WAGO_PROJECT_ID }}
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
